<header class="site-header">
  <!-- Top Letterhead Split Accent Stripe -->
  <div class="letterhead-accent-strip">
    <div class="strip-cyan"></div>
    <div class="strip-navy"></div>
  </div>

  <!-- Top White Utility Bar -->
  <div class="top-util-bar">
    <div class="container top-util-container">
      <div class="top-util-contact">
        <span class="util-contact-item">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          Dubai, UAE (Meydan HQ)
        </span>
        <span class="util-divider">|</span>
        <a href="tel:+971526735518" class="util-contact-item phone">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          +971 52 673 5518
        </a>
      </div>

      <div class="top-util-links">
        <a routerLink="/contact" class="util-link">LOOKING TO HIRE</a>
        <span class="util-divider">|</span>
        <div class="lang-selector">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span>EN</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Dark Header Bar -->
  <div class="main-dark-bar">
    <div class="container main-nav-container">
      <!-- TruePath Letterhead Logo -->
      <a routerLink="/" class="brand-logo" (click)="closeMobileMenu()">
        <div class="logo-symbol-wrap">
          <img src="assets/truepath-logo.png" alt="TruePath Logo" class="truepath-emblem-img">
        </div>
        <div class="logo-text-block">
          <div class="logo-main-title">
            <span class="name-bold">TruePath</span>
            <span class="name-legal">ventures L.L.C</span>
          </div>
          <div class="logo-subtitle">HR &nbsp; SOLUTIONS</div>
        </div>
      </a>

      <!-- Desktop Nav -->
      <nav class="desktop-nav">
        <a routerLink="/industries" class="nav-item">
          Sectors
        </a>
        <a routerLink="/services" class="nav-item">
          Services
        </a>
        <a routerLink="/portfolio" class="nav-item">
          Portfolio
        </a>
        <a routerLink="/blogs" class="nav-item">
          Blogs
        </a>
        <a routerLink="/about" class="nav-item">
          About Us
        </a>
        <a routerLink="/contact" class="nav-item">
          Connect
        </a>
        <a routerLink="/contact" class="btn btn-coral btn-sm" style="margin-left: 0.5rem;">
          Hire Talent
        </a>
      </nav>
      
    </div>

    <!-- Mobile Dropdown -->
    <div class="mobile-nav-panel" [class.open]="isMobileMenuOpen()">
      <div class="mobile-nav-list">
        <a routerLink="/industries" (click)="closeMobileMenu()">Sectors</a>
        <a routerLink="/services" (click)="closeMobileMenu()">HR Solutions & Services</a>
        <a routerLink="/portfolio" (click)="closeMobileMenu()">Client Portfolio</a>
        <a routerLink="/blogs" (click)="closeMobileMenu()">Blogs & Articles</a>
        <a routerLink="/about" (click)="closeMobileMenu()">About TruePath</a>
        <a routerLink="/contact" (click)="closeMobileMenu()">Connect / Hire</a>
      </div>
    </div>
  </div>
</header>
